<!-- Generated with Hytale UI Builder component patterns: page-overlay, container, text button, progress, back button. -->
<div id="ResourceGamePageRoot" class="page-overlay">
<div class="hero">
        <img id="CastleInfoIcon" src="Textures/ResourceGame/icons/ui_icon_kingdom_castle.png" width="64" height="64">
        <div class="hero-copy"><p class="title">Castle Info</p><p class="label">Ownership, identity, and alliance controls.</p></div>
    </div>
    <div data-hyui-title="Castle Record" id="CastleRecord" class="container">
        <div class="container-title"><p class="section">Castle Record</p></div>
        <div class="row">
            <div class="wide-card"><p class="label">Owner</p><p id="OwnerName" class="value">{{$OwnerName}}</p></div>
            <div class="wide-card"><p class="label">Castle ID</p><p id="CastleId" class="value">{{$CastleId}}</p></div>
            <div class="wide-card"><p class="label">World</p><p id="WorldName" class="value">{{$WorldName}}</p></div>
        </div>
        <div class="row">
            <div class="stat-card"><p class="label">Troops</p><p id="TroopCount" class="value">{{$TroopCount}}</p></div>
            <div class="stat-card"><p class="label">Might</p><p id="MightCount" class="value">{{$MightCount}}</p></div>
        </div>
        <p id="FeedbackStatus" class="feedback">{{$FeedbackStatus}}</p>
    </div>
    <div class="action-row">
        <button id="AttackButton" class="secondary-button">Attack (Future)</button>
        <button id="FriendButton" class="secondary-button">Add Friend (Future)</button>
        <button id="GuildButton" class="secondary-button">Guild Access (Future)</button>
        <button id="BackButton" class="nav-button">Back</button>
    </div>
