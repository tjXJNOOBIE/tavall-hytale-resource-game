<style>
    .page-overlay { anchor-width: 1080; anchor-height: 660; layout-mode: top; padding: 18; background-image: url('../Textures/ResourceGame/panels/ui_panel_workshop_base.png'); }
    .row { layout-mode: left; padding-bottom: 10; }
    .action-row { layout-mode: left; padding-bottom: 10; }
    .hero { layout-mode: left; padding-bottom: 14; }
    .hero-copy { layout-mode: top; padding-right: 16; }
    .container { anchor-width: 880; layout-mode: top; padding: 12; background-image: url('../Textures/ResourceGame/panels/ui_panel_workshop_base.png'); }
    .container-title { layout-mode: top; padding-bottom: 8; }
    .stat-card { anchor-width: 170; layout-mode: top; padding-right: 10; padding-bottom: 8; }
    .wide-card { anchor-width: 260; layout-mode: top; padding-right: 10; padding-bottom: 8; }
    .title { font-size: 26; font-weight: bold; text-transform: uppercase; color: #f4d27a; }
    .section { font-size: 17; font-weight: bold; text-transform: uppercase; color: #d6e1eb; padding-top: 4; }
    .label { font-size: 14; color: #a7b0ba; }
    .value { font-size: 20; color: #fff1c2; }
    .body { font-size: 15; color: #cfd8e1; padding-bottom: 8; }
    .feedback { font-size: 15; font-weight: bold; color: #e2c168; padding-bottom: 10; }
    button { anchor-width: 190; anchor-height: 38; padding: 7; color: #fff1c2; background-image: url('../Textures/ResourceGame/buttons/ui_button_secondary_normal.png'); }
    .primary-button { background-image: url('../Textures/ResourceGame/buttons/ui_button_primary_normal.png'); }
    .secondary-button { background-image: url('../Textures/ResourceGame/buttons/ui_button_secondary_normal.png'); }
    .confirm-button { background-image: url('../Textures/ResourceGame/buttons/ui_button_confirm_normal.png'); }
    .danger-button { background-image: url('../Textures/ResourceGame/buttons/ui_button_danger_normal.png'); }
    .nav-button { background-image: url('../Textures/ResourceGame/buttons/ui_button_secondary_normal.png'); }
    progress { anchor-width: 360; color: #e2c168; padding-bottom: 8; }
</style>
<!-- Generated with Hytale UI Builder component patterns: page-overlay, container, text button, progress, back button. -->
<div id="ResourceGamePageRoot" class="page-overlay">
<div class="hero">
        <img id="BuildingIcon" src="Textures/ResourceGame/icons/ui_icon_action_upgrade.png" width="64" height="64">
        <div class="hero-copy"><p id="BuildingTitle" class="title">{{$BuildingTitle}}</p><p id="AreaText" class="label">{{$AreaText}}</p><p id="LocationText" class="label">{{$LocationText}}</p></div>
    </div>
    <div data-hyui-title="Building Status" id="BuildingStatusPanel" class="container">
        <div class="container-title"><p class="section">Building Status</p></div>
        <div class="row">
            <div class="wide-card"><p class="label">Level</p><p id="LevelText" class="value">{{$LevelText}}</p></div>
            <div class="wide-card"><p class="label">Status</p><p id="StatusText" class="value">{{$StatusText}}</p></div>
        </div>
        <progress value="0.5" id="BuildingProgressBar"></progress>
        <p id="EffectText" class="body">{{$EffectText}}</p>
        <p id="NextUpgradeText" class="body">{{$NextUpgradeText}}</p>
        <p id="FeedbackStatus" class="feedback">{{$FeedbackStatus}}</p>
    </div>
    <div class="action-row">
        <button id="StartUpgradeButton" class="confirm-button">Start Upgrade</button>
        <button id="CancelUpgradeButton" class="danger-button">Cancel Upgrade</button>
        <button id="OverviewButton" class="secondary-button">Building Overview</button>
        <button id="BackButton" class="nav-button">Castle Menu</button>
    </div>
</div>
