name: TavallResourceGameServer
main: com.tavall.hytale.resourcegame.frontend.minecraft.server.MinecraftBukkitServerPlugin
version: 0.1.0-SNAPSHOT
description: Bukkit server-surface adapter for Tavall Resource Game.
author: Tavall
commands:
  tavallserver:
    description: Shows or pushes the Tavall Resource Game server-surface snapshot.
    usage: /tavallserver [snapshot]
permissions:
  tavall.resourcegame.server:
    description: Allows use of Tavall Resource Game server-surface diagnostics.
    default: op
